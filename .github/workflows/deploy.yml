name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh approved business pages and the sitemap every morning.
    - cron: '17 11 * * *'

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_SEND_TELEMETRY: 'false'
      VITE_SUPABASE_URL: https://ummjtrfjsztaznihckua.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Cloudflare output
        run: npx cf build --mode production

      - name: Validate deployment
        run: npx cf deploy --prebuilt --mode production --dry-run

      - name: Deploy to Cloudflare
        run: npx cf deploy --prebuilt --mode production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Submit deployed URLs to IndexNow
        run: npm run indexnow

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>I Love Lee</title>
    <script>
      ;(function () {
        var pathSegmentsToKeep = 0
        var location = window.location
        var basePath = location.pathname
          .split('/')
          .slice(0, 1 + pathSegmentsToKeep)
          .join('/')

        location.replace(
          location.protocol +
            '//' +
            location.hostname +
            (location.port ? ':' + location.port : '') +
            basePath +
            '/?/' +
            location.pathname
              .slice(1)
              .split('/')
              .slice(pathSegmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '') +
            location.hash
        )
      })()
    </script>
  </head>
  <body></body>
</html>
